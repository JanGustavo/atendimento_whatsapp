name: Testes MeshCentral

on:
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: meshcentral-remote-pr
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Testes
        run: pytest tests/ -q
      - name: Sintaxe da migracao
        run: python -m compileall -q app migrations
      - name: Migracoes SQLite do zero
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-meshcentral.sqlite
          JWT_SECRET: segredo-somente-para-o-runner-do-ci
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
