name: Testes MeshCentral

on:
  push:
    branches: [feat/meshcentral-real-session-events-20261030]
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Testes
        run: pytest tests/ -q
      - name: Sintaxe da migracao
        run: python -m compileall -q app migrations
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
