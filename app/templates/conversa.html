{% extends 'base.html' %}{% block body %}<section><h1>Conversa {{ conversa.numero }}</h1><p>Status: {{ conversa.status }}</p><div hx-get="/atendimentos/{{ conversa.id }}" hx-trigger="every 3s" hx-swap="innerHTML">{% include '_mensagens.html' %}</div>{% if conversa.status == 'aberta' %}<form action="/atendimentos/{{ conversa.id }}/mensagens" method="post"><textarea name="texto" required maxlength="4000" rows="3" placeholder="Resposta"></textarea><button>Enviar</button></form><form action="/atendimentos/{{ conversa.id }}/encerrar" method="post"><button>Encerrar conversa</button></form>{% endif %}</section>{% endblock %}
