{% extends 'base.html' %}{% block body %}<section><h1>Simulador de WhatsApp</h1><form method="get" action="/simulador"><label>Cliente fictício <select name="cliente">{% for chave, dados in clientes.items() %}<option value="{{ chave }}" {% if chave == cliente %}selected{% endif %}>{{ dados[0] }} · {{ dados[1] }}</option>{% endfor %}</select></label><button>Escolher</button></form><div hx-get="/simulador?cliente={{ cliente }}" hx-trigger="every 3s" hx-swap="innerHTML">{% include '_simulador_mensagens.html' %}</div><form method="post" action="/simulador"><input type="hidden" name="cliente" value="{{ cliente }}"><textarea name="texto" required maxlength="4000" rows="3" placeholder="Mensagem do cliente"></textarea><button>Enviar</button></form></section>{% endblock %}
