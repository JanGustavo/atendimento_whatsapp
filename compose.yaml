services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:18087:8000"
    volumes:
      - atendimento_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [webhook]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  atendimento_data:
