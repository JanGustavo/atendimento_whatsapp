services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:18087:8000"
    volumes:
      - atendimento_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [webhook]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - meshcentral_data:/meshcentral-certs:ro
    depends_on:
      app:
        condition: service_healthy

  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.2.6-slim
    profiles: [remoto]
    restart: unless-stopped
    environment:
      DYNAMIC_CONFIG: "false"
      HOSTNAME: ${MESH_HOSTNAME:-mesh.jangustavo.me}
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "false"
      USE_MONGODB: "false"
    ports:
      - "127.0.0.1:18088:443"
    volumes:
      - meshcentral_data:/opt/meshcentral/meshcentral-data
      - meshcentral_files:/opt/meshcentral/meshcentral-files
      - meshcentral_backups:/opt/meshcentral/meshcentral-backups

volumes:
  atendimento_data:
  meshcentral_data:
  meshcentral_files:
  meshcentral_backups:
